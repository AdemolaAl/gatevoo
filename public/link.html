<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Pay with Gatevoo</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap">
<style>
:root{--bg:#FAF9F5;--surface:#fff;--sunk:#F3F1EB;--line:#EAE7DF;--ink:#121110;--ink-2:#2C2925;--muted:#5E5A50;--faint:#948F82;--ok:#1F9D6B;--bad:#C8372D;--merchant:#121110;--ease:cubic-bezier(.16,1,.3,1);
  --display:"Plus Jakarta Sans",system-ui,-apple-system,"Segoe UI",sans-serif;color-scheme:light}
@media (prefers-color-scheme:dark){:root{--bg:#0C0B0A;--surface:#161513;--sunk:#1E1C19;--line:#2C2925;--ink:#F4F2EE;--ink-2:#D6D2C8;--muted:#A9A398;--faint:#6E695E;color-scheme:dark}}
*{box-sizing:border-box}html,body{margin:0;min-height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--display);font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased;letter-spacing:-.01em;
  padding:max(28px,env(safe-area-inset-top)) 16px max(28px,env(safe-area-inset-bottom));min-height:100vh;position:relative;overflow-x:hidden}
body::before{content:"";position:fixed;z-index:-1;width:420px;height:420px;left:-140px;top:-160px;border-radius:50%;filter:blur(70px);background:rgba(38,161,123,.14);animation:drift 18s ease-in-out infinite}
@keyframes drift{50%{transform:translate(60px,50px) scale(1.1)}}
.card{max-width:420px;margin:0 auto;background:var(--surface);border:1px solid var(--line);border-radius:30px;box-shadow:0 1px 2px rgba(18,17,16,.05),0 40px 70px -34px rgba(18,17,16,.35);overflow:hidden;animation:in .6s var(--ease)}
@keyframes in{from{transform:translateY(14px);opacity:0}}
.head{display:flex;align-items:center;gap:10px;padding:16px 18px;border-bottom:1px solid var(--line)}
.lg{width:34px;height:34px;border-radius:10px;background:var(--merchant);color:#fff;display:grid;place-items:center;font-weight:800;overflow:hidden;flex:none}
.lg img{width:100%;height:100%;object-fit:cover}
.nm{font-weight:800;display:flex;align-items:center;gap:6px;min-width:0}
.nm b{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.seal{width:17px;height:17px;flex:none}
.body{padding:22px 18px 22px;display:grid;gap:16px}
.lbl{font-size:12.5px;color:var(--muted)}
.amt{font-size:44px;font-weight:800;letter-spacing:-.05em;line-height:1;font-variant-numeric:tabular-nums}
.desc{color:var(--ink-2);font-size:14.5px;margin-top:4px}
.field{display:grid;gap:6px}
.field label{font-size:13px;font-weight:600;color:var(--ink-2)}
.input{width:100%;border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:14px;padding:13px 14px;font:inherit;transition:border-color .2s,box-shadow .2s}
.input:focus{outline:none;border-color:var(--ink);box-shadow:0 0 0 3px rgba(18,17,16,.08)}
.btn{display:flex;align-items:center;justify-content:center;gap:10px;width:100%;border:0;border-radius:999px;background:var(--ink);color:var(--bg);font:700 15px var(--display);padding:15px;cursor:pointer;transition:transform .15s,opacity .2s}
.btn:active{transform:scale(.98)}.btn:disabled{opacity:.6}
.btn .ar{width:26px;height:26px;border-radius:50%;background:var(--bg);color:var(--ink);display:grid;place-items:center;transition:transform .3s var(--ease)}
.btn:hover .ar{transform:rotate(-45deg)}
.coins{display:flex;gap:8px;justify-content:center;color:var(--faint);font-size:12.5px;align-items:center}
.coins i{width:18px;height:18px;border-radius:50%;display:inline-grid;place-items:center;color:#fff;font-style:normal;font-size:10px;font-weight:800}
.err{color:var(--bad);font-size:13px;margin:0;text-align:center}
.closed{text-align:center;display:grid;gap:6px;padding:18px 0}.closed b{font-size:19px}
.skel{height:220px;border-radius:16px;background:linear-gradient(90deg,var(--sunk),var(--line),var(--sunk));background-size:200% 100%;animation:sh 1.2s infinite}
@keyframes sh{to{background-position:-200% 0}}
.foot{max-width:420px;margin:16px auto 0;display:flex;justify-content:center;align-items:center;gap:8px;color:var(--faint);font-size:12px}
.foot svg{width:16px;height:16px}.foot b{color:var(--muted);font-weight:700}
.preview{justify-self:start;font:700 10.5px var(--display);letter-spacing:.08em;color:#8A5A00;background:#FFF5DF;border-radius:99px;padding:3px 9px}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<main class="card" aria-live="polite">
  <div class="head"><span class="lg" id="lg">G</span><span class="nm"><b id="nm">Loading…</b><span id="badge"></span></span></div>
  <div class="body" id="view"><div class="skel"></div></div>
</main>
<div class="foot"><svg viewBox="0 0 64 64" aria-hidden="true"><rect width="64" height="64" rx="18" fill="#121110"/><path d="M41.64 20.51A15 15 0 1 0 47 32H40" fill="none" stroke="#fff" stroke-width="6.4" stroke-linecap="round" stroke-linejoin="round"/><circle cx="32.4" cy="32" r="3.3" fill="#fff"/></svg>Powered by <b>Gate<span style="color:var(--faint)">voo</span></b></div>
<script>
(() => {
  const $ = (id) => document.getElementById(id);
  const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  const usd = (n) => '$' + Number(n).toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
  const SEAL = '<svg class="seal" viewBox="0 0 24 24" aria-label="Verified business"><path fill="currentColor" d="M12 1.5l2.2 1.6 2.7-.3 1.1 2.5 2.5 1.1-.3 2.7L21.8 11l-1.6 2.2.3 2.7-2.5 1.1-1.1 2.5-2.7-.3L12 20.8l-2.2-1.6-2.7.3-1.1-2.5-2.5-1.1.3-2.7L2.2 11l1.6-2.2-.3-2.7 2.5-1.1 1.1-2.5 2.7.3z"/><path d="M8 11.3l2.6 2.6 5.4-5.4" fill="none" stroke="var(--bg)" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></svg>';
  const m = location.pathname.match(/\/l\/([\w-]{10,16})$/);
  const slug = m ? m[1] : null;
  let demo = false;
  async function api(path, opts) {
    const r = await fetch(path, opts);
    if (!(r.headers.get('content-type') || '').includes('json')) throw Object.assign(new Error('no api'), { noApi: true });
    const j = await r.json();
    if (!r.ok) throw Object.assign(new Error(j.error || 'Something went wrong'), { status: r.status });
    return j;
  }
  function render(L) {
    const mm = L.merchant || { name: 'Gatevoo' };
    $('nm').textContent = mm.name; document.title = `Pay ${usd(L.amount_usd)} · ${mm.name}`;
    if (mm.logo && /^data:image\/(png|jpeg|webp);base64,/.test(mm.logo)) { const im = new Image(); im.alt = ''; im.src = mm.logo; $('lg').replaceChildren(im); $('lg').style.background = '#fff'; }
    else $('lg').textContent = (mm.name || 'G')[0].toUpperCase();
    if (mm.color && /^#[0-9a-f]{6}$/i.test(mm.color)) document.documentElement.style.setProperty('--merchant', mm.color);
    $('badge').innerHTML = mm.verified ? `<span title="Verified business on Gatevoo">${SEAL}</span>` : '';
    if (!L.active) { $('view').innerHTML = '<div class="closed"><b>This link is closed</b><span style="color:var(--muted)">Ask the seller for a new payment link.</span></div>'; return; }
    $('view').innerHTML = `${demo ? '<span class="preview">PREVIEW · NO REAL MONEY</span>' : ''}
      <div><div class="lbl">Amount</div><div class="amt">${usd(L.amount_usd)}</div>${L.description ? `<div class="desc">${esc(L.description)}</div>` : ''}</div>
      <form id="f" style="display:grid;gap:14px" novalidate>
        ${L.ask.name ? '<div class="field"><label for="n">Your name</label><input class="input" id="n" autocomplete="name" maxlength="80" placeholder="So the seller knows it\'s you"></div>' : ''}
        ${L.ask.contact ? `<div class="field"><label for="c">${esc(L.ask.contact_label)}</label><input class="input" id="c" maxlength="120" ${L.ask.contact === 'email' ? 'type="email" autocomplete="email"' : L.ask.contact === 'whatsapp' ? 'type="tel" autocomplete="tel"' : ''} placeholder="${L.ask.contact === 'telegram' ? '@username' : L.ask.contact === 'whatsapp' ? '+234…' : 'you@email.com'}"></div>` : ''}
        <p class="err" id="e" hidden></p>
        <button class="btn" id="go" type="submit">Continue to payment <span class="ar"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M13 6l6 6-6 6"/></svg></span></button>
      </form>
      <div class="coins">Pay with <i style="background:#26A17B">₮</i>USDT or <i style="background:#F7931A">₿</i>Bitcoin</div>`;
    $('f').addEventListener('submit', async (ev) => {
      ev.preventDefault(); const e = $('e'); e.hidden = true; const b = $('go'); b.disabled = true;
      try {
        if (demo) { location.href = 'pay.html'; return; }
        const r = await api(`/api/link/${slug}/start`, { method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify({ name: $('n')?.value || '', contact: $('c')?.value || '' }) });
        location.href = `/pay/${encodeURIComponent(r.id)}`;
      } catch (x) { e.textContent = x.message; e.hidden = false; b.disabled = false; }
    });
  }
  (async () => {
    try { if (!slug) throw Object.assign(new Error(), { noApi: true }); render(await api(`/api/link/${slug}`)); }
    catch (x) {
      if (x.noApi || x instanceof TypeError) { demo = true; render({ active: true, amount_usd: 100, description: 'VIP access, 30 days', ask: { name: true, contact: 'telegram', contact_label: 'Telegram username' }, merchant: { name: 'Zedapex', verified: true } }); }
      else { $('nm').textContent = 'Gatevoo'; $('view').innerHTML = `<div class="closed"><b>Link not found</b><span style="color:var(--muted)">${esc(x.message)}</span></div>`; }
    }
  })();
})();
</script>
</body>
</html>
